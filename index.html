<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Treino – Alice</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose-50: #fff1f4;
      --rose-100: #ffe0e6;
      --rose-200: #ffc2ce;
      --rose-300: #ff94aa;
      --rose-400: #ff5e7e;
      --rose-500: #f83058;
      --rose-light: #ffb3c1;
      --pink-soft: #fce8ed;
      --gray-50: #fafafa;
      --gray-100: #f4f4f5;
      --gray-200: #e4e4e7;
      --gray-300: #d1d1d6;
      --gray-400: #a1a1aa;
      --gray-500: #71717a;
      --gray-600: #52525b;
      --gray-700: #3f3f46;
      --gray-800: #27272a;
      --white: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(160deg, #fff5f7 0%, #fafafa 60%, #f0f0f2 100%);
      min-height: 100vh;
      color: var(--gray-700);
    }

    /* ── HEADER ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--rose-100);
      padding: 28px 24px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(255,94,126,0.07);
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.9rem, 9vw, 4.2rem);
      font-weight: 700;
      color: var(--gray-800);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    header h1 span { color: #f4a0b5; }
    header p {
      font-size: 0.76rem;
      color: var(--gray-400);
      margin-top: 5px;
      font-style: italic;
      letter-spacing: 0.3px;
    }

    /* ── MAIN ── */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }

    /* ── SYNC STATUS ── */
    #sync-status {
      text-align: center;
      font-size: 0.75rem;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--gray-100);
      color: var(--gray-500);
    }
    #sync-status.online { background: #e8f8f0; color: #2e7d52; }
    #sync-status.offline { background: #fff3e0; color: #b86a00; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .sync-wrap { display: flex; justify-content: center; margin-bottom: 4px; }

    /* ── ADD SECTION BTN ── */
    .add-section-btn {
      width: 100%;
      padding: 14px;
      background: var(--white);
      border: 2px dashed var(--rose-200);
      border-radius: var(--radius);
      color: var(--rose-400);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .add-section-btn:hover { background: var(--rose-50); border-color: var(--rose-300); }

    /* ── SECTION CARD ── */
    .section-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid var(--gray-100);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

    .section-header {
      background: linear-gradient(120deg, #fff0f3 0%, #ffedf2 100%);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--rose-100);
    }
    .section-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--gray-800);
      flex: 1;
    }
    .section-actions { display: flex; gap: 6px; }

    .icon-btn {
      background: none;
      border: 1px solid var(--gray-200);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: var(--gray-300);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .icon-btn:hover { background: var(--gray-100); color: var(--gray-500); border-color: var(--gray-300); }
    .icon-btn.danger { color: var(--gray-300); border-color: var(--gray-200); }
    .icon-btn.danger:hover { background: var(--rose-50); color: var(--rose-300); border-color: var(--rose-200); }

    .section-body { padding: 16px 20px; }

    /* ── EXERCISE CARD ── */
    .exercise-card {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 12px;
      animation: fadeIn 0.25s ease;
    }
    .exercise-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .exercise-name {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--gray-800);
    }
    .exercise-actions { display: flex; gap: 4px; }

    /* ── COUNTERS ── */
    .counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }
    .counter-box {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .counter-label {
      font-size: 0.68rem;
      color: var(--gray-400);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
      display: block;
    }
    .counter-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .counter-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--rose-200);
      background: var(--white);
      color: var(--rose-400);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-weight: 600;
    }
    .counter-btn:hover { background: var(--rose-100); border-color: var(--rose-300); }
    .counter-value {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--gray-800);
      min-width: 32px;
      text-align: center;
    }

    /* ── NOTES ── */
    .exercise-notes {
      width: 100%;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      color: var(--gray-600);
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      min-height: 36px;
    }
    .exercise-notes:focus { border-color: var(--rose-300); }
    .exercise-notes::placeholder { color: var(--gray-300); }

    /* ── ADD EXERCISE BTN ── */
    .add-exercise-btn {
      width: 100%;
      padding: 10px;
      background: var(--rose-50);
      border: 1.5px dashed var(--rose-200);
      border-radius: 10px;
      color: var(--rose-400);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .add-exercise-btn:hover { background: var(--rose-100); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
    }
    .modal h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--gray-800);
      margin-bottom: 18px;
    }
    .modal label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .modal input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--gray-800);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }
    .modal input:focus { border-color: var(--rose-300); }
    .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
    .btn-primary {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, #f4a0b5 0%, #f7beca 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      padding: 12px 18px;
      background: var(--gray-100);
      border: none;
      border-radius: 10px;
      color: var(--gray-600);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-secondary:hover { background: var(--gray-200); }

    /* ── CONFIRM MODAL ── */
    .confirm-text {
      font-size: 0.9rem;
      color: var(--gray-600);
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn-danger {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, #f4a0b5 0%, #f7beca 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-danger:hover { opacity: 0.9; }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--gray-400);
    }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; line-height: 1.6; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rose-200); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>Meu <span>Treino</span></h1>
  <p>Alice cada dia mais gostosa 🍑</p>
</header>

<main>
  <div class="sync-wrap">
    <div id="sync-status">
      <span class="sync-dot"></span>
      <span id="sync-text">Armazenamento local</span>
    </div>
  </div>

  <button class="add-section-btn" onclick="openAddSection()">
    <span style="font-size:1.2rem">＋</span> Nova Seção de Treino
  </button>

  <div id="sections-container"></div>

  <div id="empty-state" class="empty-state" style="display:none">
    <div class="emoji">🫦</div>
    <p>Nenhuma seção criada ainda.<br>Adicione sua primeira seção acima!</p>
  </div>
</main>

<!-- MODALS -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ─── CONFIG SUPABASE ─────────────────────────────────────────
// Substitua pelos seus dados do Supabase após configurar
const SUPABASE_URL = 'https://lwliemjzprhvyvcwsubc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3bGllbWp6cHJodnl2Y3dzdWJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzI5MDAsImV4cCI6MjA5NTIwODkwMH0.oX2kv0MZOxiDNE9insIrJFQ2tdH_DzQ62hCUmcDp42o';

const useSupabase = SUPABASE_URL !== '' && SUPABASE_ANON_KEY !== '';

// ─── ESTADO ──────────────────────────────────────────────────
let state = { sections: [] };
let saveTimer = null;

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// ─── PERSISTÊNCIA ────────────────────────────────────────────
function loadState() {
  const raw = localStorage.getItem('meu-treino-alice');
  if (raw) {
    try { state = JSON.parse(raw); } catch(e) { state = { sections: [] }; }
  }
}

function saveLocal() {
  localStorage.setItem('meu-treino-alice', JSON.stringify(state));
}

async function saveSupabase() {
  if (!useSupabase) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/treino_data`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ id: 'alice', data: JSON.stringify(state) })
    });
    if (res.ok) setSyncStatus('online', 'Salvo na nuvem ✓');
    else setSyncStatus('offline', 'Erro ao salvar');
  } catch(e) {
    setSyncStatus('offline', 'Sem conexão');
  }
}

async function loadSupabase() {
  if (!useSupabase) return false;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/treino_data?id=eq.alice`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    const rows = await res.json();
    if (rows && rows[0] && rows[0].data) {
      state = JSON.parse(rows[0].data);
      setSyncStatus('online', 'Sincronizado ✓');
      return true;
    }
  } catch(e) {
    setSyncStatus('offline', 'Modo offline');
  }
  return false;
}

function setSyncStatus(type, text) {
  const el = document.getElementById('sync-status');
  const txt = document.getElementById('sync-text');
  el.className = type;
  txt.textContent = text;
}

function scheduleSave() {
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveSupabase, 1500);
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  const container = document.getElementById('sections-container');
  const emptyState = document.getElementById('empty-state');

  if (state.sections.length === 0) {
    container.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  container.innerHTML = state.sections.map(sec => renderSection(sec)).join('');

  // bind notes textarea change
  container.querySelectorAll('.exercise-notes').forEach(ta => {
    ta.addEventListener('change', e => {
      const { sectionId, exerciseId } = e.target.dataset;
      const sec = state.sections.find(s => s.id === sectionId);
      const ex = sec && sec.exercises.find(ex => ex.id === exerciseId);
      if (ex) { ex.notes = e.target.value; scheduleSave(); }
    });
  });
}

function renderSection(sec) {
  const exercises = (sec.exercises || []).map(ex => renderExercise(sec.id, ex)).join('');
  return `
  <div class="section-card" id="sec-${sec.id}">
    <div class="section-header">
      <span class="section-name">${esc(sec.name)}</span>
      <div class="section-actions">
        <button class="icon-btn" onclick="openEditSection('${sec.id}')" title="Editar">alterar</button>
        <button class="icon-btn danger" onclick="openConfirm('seção','${sec.id}',null)" title="Excluir">excluir</button>
      </div>
    </div>
    <div class="section-body">
      ${exercises}
      <button class="add-exercise-btn" onclick="openAddExercise('${sec.id}')">＋ Adicionar Exercício</button>
    </div>
  </div>`;
}

function renderExercise(sectionId, ex) {
  return `
  <div class="exercise-card" id="ex-${ex.id}">
    <div class="exercise-top">
      <span class="exercise-name">${esc(ex.name)}</span>
      <div class="exercise-actions">
        <button class="icon-btn" onclick="openEditExercise('${sectionId}','${ex.id}')" title="Editar">alterar</button>
        <button class="icon-btn danger" onclick="openConfirm('exercício','${sectionId}','${ex.id}')" title="Excluir">excluir</button>
      </div>
    </div>
    <div class="counters">
      ${renderCounter(sectionId, ex.id, 'peso', 'Peso / kg', ex.peso, 0.5)}
      ${renderCounter(sectionId, ex.id, 'series', 'Séries', ex.series, 1)}
      ${renderCounter(sectionId, ex.id, 'reps', 'Repetições', ex.reps, 1)}
    </div>
    <textarea class="exercise-notes"
      placeholder="Observações (opcional)…"
      data-section-id="${sectionId}"
      data-exercise-id="${ex.id}"
      rows="1"
    >${esc(ex.notes || '')}</textarea>
  </div>`;
}

function renderCounter(secId, exId, field, label, value, step) {
  return `
  <div class="counter-box">
    <span class="counter-label">${label}</span>
    <div class="counter-controls">
      <button class="counter-btn" onclick="changeCounter('${secId}','${exId}','${field}',${-step})">−</button>
      <span class="counter-value" id="cnt-${exId}-${field}">${value}</span>
      <button class="counter-btn" onclick="changeCounter('${secId}','${exId}','${field}',${step})">+</button>
    </div>
  </div>`;
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── CONTADORES ──────────────────────────────────────────────
function changeCounter(secId, exId, field, delta) {
  const sec = state.sections.find(s => s.id === secId);
  if (!sec) return;
  const ex = sec.exercises.find(e => e.id === exId);
  if (!ex) return;
  const min = field === 'peso' ? 0 : 1;
  const step = field === 'peso' ? 0.5 : 1;
  let val = parseFloat(ex[field]) + delta;
  val = Math.max(min, Math.round(val / step) * step);
  ex[field] = val;
  const el = document.getElementById(`cnt-${exId}-${field}`);
  if (el) el.textContent = val;
  scheduleSave();
}

// ─── MODAL ───────────────────────────────────────────────────
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ─── SEÇÕES ──────────────────────────────────────────────────
function openAddSection() {
  openModal(`
    <h3>Nova Seção</h3>
    <label>Nome da seção</label>
    <input id="inp-sec-name" type="text" placeholder="Ex: Treino A – Pernas" autofocus />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="addSection()">Criar Seção</button>
    </div>
  `);
  setTimeout(() => document.getElementById('inp-sec-name')?.focus(), 50);
}

function addSection() {
  const name = document.getElementById('inp-sec-name').value.trim();
  if (!name) return;
  state.sections.push({ id: genId(), name, exercises: [] });
  closeModal();
  scheduleSave();
  render();
}

function openEditSection(secId) {
  const sec = state.sections.find(s => s.id === secId);
  if (!sec) return;
  openModal(`
    <h3>Editar Seção</h3>
    <label>Nome da seção</label>
    <input id="inp-sec-name" type="text" value="${esc(sec.name)}" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="editSection('${secId}')">Salvar</button>
    </div>
  `);
  setTimeout(() => { const i = document.getElementById('inp-sec-name'); if(i){i.focus();i.select();} }, 50);
}

function editSection(secId) {
  const name = document.getElementById('inp-sec-name').value.trim();
  if (!name) return;
  const sec = state.sections.find(s => s.id === secId);
  if (sec) { sec.name = name; scheduleSave(); render(); }
  closeModal();
}

// ─── EXERCÍCIOS ──────────────────────────────────────────────
function openAddExercise(secId) {
  openModal(`
    <h3>Novo Exercício</h3>
    <label>Nome do exercício</label>
    <input id="inp-ex-name" type="text" placeholder="Ex: Agachamento livre" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="addExercise('${secId}')">Adicionar</button>
    </div>
  `);
  setTimeout(() => document.getElementById('inp-ex-name')?.focus(), 50);
}

function addExercise(secId) {
  const name = document.getElementById('inp-ex-name').value.trim();
  if (!name) return;
  const sec = state.sections.find(s => s.id === secId);
  if (!sec) return;
  if (!sec.exercises) sec.exercises = [];
  sec.exercises.push({ id: genId(), name, peso: 0, series: 3, reps: 12, notes: '' });
  closeModal();
  scheduleSave();
  render();
}

function openEditExercise(secId, exId) {
  const sec = state.sections.find(s => s.id === secId);
  const ex = sec && sec.exercises.find(e => e.id === exId);
  if (!ex) return;
  openModal(`
    <h3>Editar Exercício</h3>
    <label>Nome</label>
    <input id="inp-ex-name" type="text" value="${esc(ex.name)}" />
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="editExercise('${secId}','${exId}')">Salvar</button>
    </div>
  `);
  setTimeout(() => { const i = document.getElementById('inp-ex-name'); if(i){i.focus();i.select();} }, 50);
}

function editExercise(secId, exId) {
  const name = document.getElementById('inp-ex-name').value.trim();
  if (!name) return;
  const sec = state.sections.find(s => s.id === secId);
  const ex = sec && sec.exercises.find(e => e.id === exId);
  if (ex) { ex.name = name; scheduleSave(); render(); }
  closeModal();
}

// ─── CONFIRMAÇÃO DE EXCLUSÃO ─────────────────────────────────
function openConfirm(tipo, secId, exId) {
  const msg = exId
    ? `Tem certeza que deseja excluir este exercício?`
    : `Tem certeza que deseja excluir esta seção e todos os seus exercícios?`;
  openModal(`
    <h3>Excluir ${tipo}</h3>
    <p class="confirm-text">${msg}</p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-danger" onclick="confirmDelete('${secId}','${exId || ''}')">Excluir</button>
    </div>
  `);
}

function confirmDelete(secId, exId) {
  if (exId) {
    const sec = state.sections.find(s => s.id === secId);
    if (sec) sec.exercises = sec.exercises.filter(e => e.id !== exId);
  } else {
    state.sections = state.sections.filter(s => s.id !== secId);
  }
  closeModal();
  scheduleSave();
  render();
}

// ─── INIT ─────────────────────────────────────────────────────
async function init() {
  loadState();
  render();
  if (useSupabase) {
    setSyncStatus('offline', 'Carregando...');
    const loaded = await loadSupabase();
    if (loaded) render();
  }
}

init();
</script>
</body>
</html>
